services:
  image-service:
    build: .
    ports:
      - "${IMAGE_SERVICE_PORT:-18566}:18566"
    environment:
      - JIMENG_BASE_URL=${IMAGE_JIMENG_BASE_URL:-http://8.209.250.40:5100}
      - SERVER_PORT=18566
      - DATA_FILE=/data/data.json
    volumes:
      - ./data/image:/data
    restart: unless-stopped

  video-service:
    build: .
    ports:
      - "${VIDEO_SERVICE_PORT:-18567}:18567"
    environment:
      - JIMENG_BASE_URL=${VIDEO_JIMENG_BASE_URL:-http://8.209.250.40:5100}
      - SERVER_PORT=18567
      - DATA_FILE=/data/data.json
    volumes:
      - ./data/video:/data
    restart: unless-stopped
