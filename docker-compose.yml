services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "18566:18566"
    depends_on:
      - image-service
      - video-service
    restart: unless-stopped

  image-service:
    build: .
    environment:
      - JIMENG_BASE_URL=http://8.209.250.40:5100
      - SERVER_PORT=18765
      - DATA_FILE=/data/data.json
    volumes:
      - ./data/image:/data
    restart: unless-stopped

  video-service:
    build: .
    environment:
      - JIMENG_BASE_URL=http://8.209.250.40:5100
      - SERVER_PORT=18765
      - DATA_FILE=/data/data.json
    volumes:
      - ./data/video:/data
    restart: unless-stopped
